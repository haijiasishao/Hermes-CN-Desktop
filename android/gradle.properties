# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.daemon=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP pulls its own aapt2 (x86_64-only) from Maven on every host; on Linux
# ARM64 point it at the SDK drop-in built by android-arm-build-tools.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
