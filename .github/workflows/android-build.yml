name: Android APK Build

on:
  push:
    branches: [feat/android-port]
    paths:
      - "src/**"
      - "web/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tauri.conf.json"
      - "capabilities/**"
      - "gen/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux deps (webkit/gtk for Tauri build script)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libglib2.0-dev libcairo2-dev \
            libpango1.0-dev libatk1.0-dev libgdk-pixbuf2.0-dev \
            libx11-dev libxdo-dev librsvg2-dev patchelf

      - name: Install Android SDK + NDK 27
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build web (frontendDist)
        run: pnpm --filter @hermes/web build:desktop

      - name: Audit Android IPC boundary
        run: node scripts/check-android-ipc.mjs

      - name: Install Rust tauri-cli (cargo subcommand required by Gradle BuildTask)
        run: |
          cargo install tauri-cli --version 2.11.1
          cargo tauri --version

      - name: Build APK (aarch64)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          pnpm tauri android build --apk --target aarch64

      - name: Sign APK with debug keystore (internal testing)
        run: |
          # Android 官方 debug 签名约定：storepass/keypass=android, alias=androiddebugkey
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          SIGNED="gen/android/app/build/outputs/apk/universal/release/hermes-agent-mobile.apk"
          ls -la "$APK"
          "$APKSIGNER" sign --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$SIGNED" "$APK"
          "$APKSIGNER" verify --print-certs "$SIGNED" | head -5
          ls -la "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-mobile-apk
          path: |
            gen/android/app/build/outputs/apk/**/release/hermes-agent-mobile.apk
          if-no-files-found: error
